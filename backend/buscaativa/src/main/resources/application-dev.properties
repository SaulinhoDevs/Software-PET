# DATASOURCE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:devdb
spring.datasource.username=sa
spring.datasource.password=

# H2 CLIENT
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA, SQL
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=create

# JWT
api.security.token.secret=u$B5v9xK2zR8qP4nM1fL6jQ0wE7yT3vH9sA8dG5jF2kL4pQ9oR1tY6uI3oP7nW0mX

# RF26 - Alerta diario de pacientes em vermelho
# Enquanto estiver false, nenhum e-mail real e enviado (so aparece no log).
app.alertas.email.habilitado=false
app.alertas.email.remetente=${MAIL_REMETENTE:nao-responda@buscaativa.local}
app.alertas.cron=0 0 6 * * *
app.alertas.zone=America/Bahia

# Servidor SMTP (use variaveis de ambiente, nunca grave senha no repositorio)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Link exibido no e-mail (deixe vazio para nao exibir)
app.alertas.url-sistema=http://localhost:4200